<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">HN Glance</title>
  <desc id="description">A visual Hacker News reader</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.58" stop-color="#f4510b"/>
      <stop offset="1" stop-color="#c93409"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#7c1d08" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="56" r="260" fill="#ffb56b" opacity="0.2"/>
  <circle cx="80" cy="620" r="220" fill="#9a2008" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="54" y="48" width="1092" height="534" rx="38" fill="url(#panel)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="102" y="104" width="262" height="38" rx="19" fill="#ffedd5"/>
    <circle cx="126" cy="123" r="7" fill="#f97316"/>
    <text x="146" y="129" fill="#9a3412" font-size="16" font-weight="700" letter-spacing="1.7">VISUAL HN READER</text>

    <text x="98" y="272" fill="#202634" font-size="132" font-weight="800" letter-spacing="-8">HN</text>
    <text x="102" y="344" fill="#f25c16" font-size="56" font-weight="800" letter-spacing="12">GLANCE</text>
    <text x="104" y="409" fill="#475569" font-size="29" font-weight="600">See the shape of a story</text>
    <text x="104" y="447" fill="#475569" font-size="29" font-weight="600">before opening it.</text>
    <text x="104" y="510" fill="#64748b" font-size="19">Feeds · visual previews · HN discussions</text>
  </g>

  <g transform="translate(712 92) rotate(1.4 190 220)" filter="url(#shadow)">
    <rect width="390" height="446" rx="24" fill="url(#preview)" stroke="#d7dee8" stroke-width="2"/>
    <path d="M316 0h50a24 24 0 0 1 24 24v50z" fill="#e2e8f0"/>
    <path d="M316 0l74 74h-50a24 24 0 0 1-24-24z" fill="#ffffff"/>

    <rect x="0" y="0" width="390" height="56" rx="24" fill="#ffffff" opacity="0.78"/>
    <rect x="0" y="32" width="390" height="24" fill="#ffffff" opacity="0.78"/>
    <circle cx="31" cy="28" r="7" fill="#fb923c"/>
    <rect x="51" y="22" width="116" height="12" rx="6" fill="#94a3b8"/>
    <rect x="286" y="22" width="56" height="12" rx="6" fill="#cbd5e1"/>

    <rect x="30" y="92" width="212" height="18" rx="9" fill="#334155"/>
    <rect x="30" y="122" width="298" height="12" rx="6" fill="#94a3b8"/>
    <rect x="30" y="146" width="256" height="12" rx="6" fill="#cbd5e1"/>

    <g transform="translate(30 190)">
      <rect width="330" height="58" rx="14" fill="#ffffff" stroke="#fed7aa"/>
      <circle cx="28" cy="29" r="9" fill="#f97316"/>
      <rect x="49" y="17" width="188" height="10" rx="5" fill="#475569"/>
      <rect x="49" y="35" width="132" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g transform="translate(30 264)">
      <rect width="330" height="58" rx="14" fill="#ffffff" stroke="#bae6fd"/>
      <circle cx="28" cy="29" r="9" fill="#0ea5e9"/>
      <rect x="49" y="17" width="222" height="10" rx="5" fill="#475569"/>
      <rect x="49" y="35" width="158" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g transform="translate(30 338)">
      <rect width="330" height="58" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
      <circle cx="28" cy="29" r="9" fill="#22c55e"/>
      <rect x="49" y="17" width="168" height="10" rx="5" fill="#475569"/>
      <rect x="49" y="35" width="198" height="8" rx="4" fill="#cbd5e1"/>
    </g>
  </g>
</svg>
